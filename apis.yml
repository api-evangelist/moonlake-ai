aid: moonlake-ai
name: MoonLake AI
description: >-
  Moonlake AI Inc. is a San Francisco based company building world models and
  simulation infrastructure for embodied AI. Its platform turns an image, video,
  or text description into physically accurate, simulation-ready 3D models of the
  world — assets shipped with baked-in physics and articulation (joints, ranges,
  drive limits) that export directly to USD, NVIDIA Isaac Sim, and MuJoCo. Teams
  generate sim environments and digital twins in hours instead of weeks via a
  hosted generation API. Moonlake is backed by Threshold (formerly DFJ), AIX
  Ventures, and NVIDIA's venture arm, and was named to the CB Insights AI 100 in
  2026.
